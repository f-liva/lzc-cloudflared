application:
  subdomain: cloudflared
  background_task: true
  routes:
    - /=http://host.lzcapp:36500/
services:
  cloudflared:
    network_mode: host
    image: docker.io/fliva/lzc-cloudflared:1.0.3
    binds:
      - /lzcapp/var/config:/config
    environment:
      - PROTOCOL=quic
      - HA_CONNECTIONS=1
